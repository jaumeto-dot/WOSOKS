<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WOS · Wine Operations</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=11" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 3h8v5a4 4 0 0 1-3 3.87V18h4v2H7v-2h4v-6.13A4 4 0 0 1 8 8V3Zm2 2v3a2 2 0 1 0 4 0V5h-4Z" />
          </svg>
        </div>
        <div>
          <strong>WOS</strong>
          <span>Wine Operations</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="admin-button" id="usersToggle" type="button" hidden>Usuarios</button>
        <label class="import-button" id="importLabel">
          <input id="fileInput" type="file" accept=".xlsx" />
          <span>Importar Excel</span>
        </label>
        <a class="logout-link" href="/logout">Salir</a>
      </div>
    </header>

    <main class="app">
      <section class="search-card">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 4a6.5 6.5 0 0 1 5.16 10.45l4.45 4.44-1.42 1.42-4.44-4.45A6.5 6.5 0 1 1 10.5 4Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z" />
        </svg>
        <input id="searchInput" type="search" placeholder="Buscar vino, productor, región, añada..." autocomplete="off" />
      </section>

      <section class="chips" id="outletChips" aria-label="Outlets"></section>
      <section class="chips category-chips" id="categoryChips" aria-label="Categorías"></section>

      <button class="filters-title" id="filtersToggle" type="button">
        <span class="sliders">☷</span>
        <span id="filtersLabel">Filtros</span>
        <span class="filters-chevron" id="filtersChevron">⌄</span>
      </button>

      <section class="filters" id="filtersPanel" hidden>
        <select id="typeFilter" aria-label="Tipo"><option value="">Tipo</option></select>
        <select id="countryFilter" aria-label="País"><option value="">País</option></select>
        <select id="regionFilter" aria-label="Región"><option value="">Región</option></select>
        <select id="producerFilter" aria-label="Productor"><option value="">Productor</option></select>
        <select id="vintageFilter" aria-label="Añada"><option value="">Añada</option></select>
      </section>

      <section class="import-status" id="importStatus" hidden>
        <div>
          <strong id="importStatusText">Subiendo Excel...</strong>
          <span id="importPercent">0%</span>
        </div>
        <progress id="importProgress" max="100" value="0"></progress>
      </section>

      <section class="users-panel" id="usersPanel" hidden>
        <div class="panel-head">
          <div>
            <h2>Usuarios</h2>
            <p>Admin crea usuarios, editor importa Excel, viewer solo consulta. Las contraseñas estan protegidas: desde aqui solo se resetean.</p>
          </div>
          <button id="refreshUsers" type="button">Actualizar</button>
        </div>
        <form class="user-form" id="userForm">
          <input id="newUsername" name="username" placeholder="Usuario" autocomplete="off" required />
          <input id="newPassword" name="password" type="password" placeholder="Contraseña" required />
          <select id="newRole" name="role" required>
            <option value="viewer">viewer</option>
            <option value="editor">editor</option>
            <option value="admin">admin</option>
          </select>
          <button type="submit">Crear</button>
        </form>
        <div class="users-table" id="usersTable" aria-live="polite"></div>
      </section>

      <p class="count" id="resultCount"></p>
      <section class="results" id="results"></section>
      <p class="empty" id="emptyState">No hay vinos con estos filtros.</p>
    </main>

    <dialog id="wineDialog">
      <button class="close" id="closeDialog" aria-label="Cerrar">×</button>
      <div id="dialogContent"></div>
    </dialog>

    <script src="./app.js?v=12"></script>
  </body>
</html>
